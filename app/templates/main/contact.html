{% extends "base.html" %}

{% block title %}Contact Us - Prosno.io{% endblock %}

{% block content %}
<section class="contact-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="contact-header text-center mb-5">
                    <h1><i class="bi bi-envelope"></i> Contact Us</h1>
                    <p class="lead">Have questions or feedback? We'd love to hear from you!</p>
                </div>
                
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="contact-info-card">
                            <div class="contact-icon">
                                <i class="bi bi-envelope-fill"></i>
                            </div>
                            <h4>Email</h4>
                            <p>support@prosno.io</p>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="contact-info-card">
                            <div class="contact-icon">
                                <i class="bi bi-telephone-fill"></i>
                            </div>
                            <h4>Phone</h4>
                            <p>+880 1234-567890</p>
                        </div>
                    </div>
                </div>
                
                <div class="contact-form-card mt-5">
                    <h3 class="mb-4">Send us a Message</h3>
                    <form action="#" method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Your Name</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="col-12">
                                <label for="subject" class="form-label">Subject</label>
                                <input type="text" class="form-control" id="subject" name="subject" required>
                            </div>
                            <div class="col-12">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-send me-2"></i>
                                    Send Message
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
