{% extends "base.html" %}
{% block title %}Waiting for Quiz — Prosno.io{% endblock %}

{% block extra_css %}
<style>
    .quiz-wait-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        padding-top: 100px;
        background: linear-gradient(135deg, #0a0f1c 0%, #121a2e 50%, #0d1117 100%);
    }

    .quiz-wait-card {
        width: 100%;
        max-width: 480px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 3rem 2rem;
        backdrop-filter: blur(24px);
        text-align: center;
    }

    .quiz-wait-pulse {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 2rem;
        color: #fff;
        animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

        0%,
        100% {
            box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
        }

        50% {
            box-shadow: 0 0 0 20px rgba(99, 102, 241, 0);
        }
    }

    .quiz-wait-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 0.5rem;
    }

    .quiz-wait-subtitle {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.95rem;
        margin-bottom: 2rem;
    }

    .quiz-wait-name {
        display: inline-block;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 12px;
        padding: 10px 20px;
        color: #a5b4fc;
        font-weight: 600;
        font-size: 1rem;
    }

    .quiz-wait-dots {
        margin-top: 2rem;
        display: flex;
        gap: 6px;
        justify-content: center;
    }

    .quiz-wait-dots span {
        width: 10px;
        height: 10px;
        background: #6366f1;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
    }

    .quiz-wait-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .quiz-wait-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes bounce {

        0%,
        80%,
        100% {
            transform: scale(0.6);
            opacity: 0.4;
        }

        40% {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="quiz-wait-wrapper">
    <div class="quiz-wait-card">
        <div class="quiz-wait-pulse"><i class="bi bi-hourglass-split"></i></div>
        <h1 class="quiz-wait-title">Waiting for Quiz to Start</h1>
        <p class="quiz-wait-subtitle">Your teacher will start the quiz soon. Stay on this page!</p>

        <div class="quiz-wait-name">
            <i class="bi bi-person-fill"></i> {{ student_name }}
        </div>

        <div class="quiz-wait-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    (function () {
        const code = '{{ quiz.join_code }}';

        // Poll every 3 seconds to check if quiz started
        setInterval(async () => {
            try {
                const res = await fetch(`/quiz/${code}/status`);
                const data = await res.json();
                if (data.status === 'active') {
                    window.location.href = `/quiz/${code}/play`;
                } else if (data.status === 'ended') {
                    window.location.href = `/quiz/${code}/score`;
                }
            } catch (e) { }
        }, 3000);
    })();
</script>
{% endblock %}
